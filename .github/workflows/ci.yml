name: CI

# Builds StyleMate on GitHub's Apple-silicon macOS runner and runs the test suite on an iOS simulator.
#
# The on-device models (face detector + embedder, GarmentNet garment segmenter, fashion encoder) are
# git-ignored (large, licence-restricted weights), so the first job regenerates them from the public
# checkpoints (scripts/build_face_models.sh, scripts/build_wardrobe_models.sh; GarmentNet's head from the
# garment-model.yml run pinned in scripts/garment/model.json) and keeps them in the
# Actions cache (never in a public artifact or release). Later runs restore them in seconds; feature
# branches restore main's cache.
#
# Runs on every branch push, so parallel feature branches each get their own build + test signal.
# The `ci-report` artifact holds build/test logs and the extraction test's cutouts.
#
# The macOS runners are shared by every branch, so a run only takes the jobs it needs (`plan`, on Linux):
#   - main and pull requests: everything.
#   - feature-branch push: unit tests + Release compile. Add `[ui]` (or `[full]`) to the commit message
#     for the UI tests and screenshots, `[tests: StyleMateTests/TryOnTests, ...]` to run only those
#     unit tests, `[ui-only: RealFirstRunE2ETests, ...]` for the UI job with only those classes (no `[ui]`
#     needed), `[skip ci]` for no run at all. Docs-only pushes don't run (and don't cancel a run).
#   - Run workflow (dispatch): the `unit_tests` and `ui_tests` inputs do the same.
#   - Studio coverage renders (3 Macs, ~45 min): only with `[studio]` or `[full]` in the commit message
#     (any branch, main included) or the dispatch input `studio`.
# The `models` job only takes a Mac when a model cache is actually missing.

on:
  push:
    branches: ['**']
    # Docs-only pushes, and pushes that only retune garment-model training (garment-model.yml), need no app build.
    # (only the garment files that feed the app's model — model.json, export.py, head.py, backbone.py —
    # are part of the wardrobe cache key; the rest is training code that runs in garment-model.yml).
    paths-ignore: ['docs/**', '**/*.md', 'scripts/garment/train_config.json', 'scripts/garment/train.py',
                   'scripts/garment/train_args.py', 'scripts/garment/extract.py', 'scripts/garment/fashionpedia.py',
                   '.github/workflows/garment-model.yml']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      unit_tests:
        description: "Only these unit tests, comma-separated (e.g. StyleMateTests/TryOnTests). Empty = all."
        type: string
        default: ""
      ui_tests:
        description: "Run the UI tests (e2e-screens)"
        type: boolean
        default: true
      studio:
        description: "Also run the studio coverage renders (3 Macs, ~45 min)"
        type: boolean
        default: false
      audit:
        description: "Also run the concurrency audit (strict concurrency + Thread Sanitizer, ~1 h)"
        type: boolean
        default: false
  schedule:
    - cron: "0 4 * * 1"   # Mondays 04:00 UTC: concurrency audit (main only)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      build_models: ${{ steps.models.outputs.build }}
      ui: ${{ steps.tier.outputs.ui }}
      studio: ${{ steps.tier.outputs.studio }}
      unit_tests: ${{ steps.tier.outputs.unit_tests }}
      ui_only: ${{ steps.tier.outputs.ui_only }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick the jobs
        id: tier
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          MSG: ${{ github.event.head_commit.message }}
          UI_INPUT: ${{ inputs.ui_tests }}
          STUDIO_INPUT: ${{ inputs.studio }}
          TESTS_INPUT: ${{ inputs.unit_tests }}
        run: |
          ui=false; studio=false; tests=""; uionly=""
          if [ "$REF" = "refs/heads/main" ] || [ "$EVENT" = "pull_request" ]; then
            ui=true
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            [ "$UI_INPUT" = "true" ] && ui=true
            [ "$STUDIO_INPUT" = "true" ] && studio=true
            tests="$TESTS_INPUT"
          fi
          # Studio coverage renders (3 Macs, ~45 min) only when asked, on any branch: they come from fixed
          # fixture cutouts, so other branches' merges don't change them.
          case "$MSG" in *"[studio]"*|*"[full]"*) studio=true;; esac
          if [ "$REF" != "refs/heads/main" ] && [ "$EVENT" = "push" ]; then
            case "$MSG" in *"[ui]"*|*"[full]"*) ui=true;; esac
            tests=$(printf '%s' "$MSG" | sed -n 's/.*\[tests:\([^]]*\)\].*/\1/p' | head -1)
            # `[ui-only: RealFirstRunE2ETests, FirstRunE2ETests]`: the UI job with only these classes.
            # The last one counts (tags go at the end; the body may quote the syntax).
            uionly=$(printf '%s' "$MSG" | sed -n 's/.*\[ui-only:\([^]]*\)\].*/\1/p' | tail -1)
            if [ -n "$uionly" ]; then ui=true; fi
          fi
          # Test identifiers only (StyleMateTests/Suite/test), so nothing else reaches xcodebuild.
          tests=$(printf '%s' "$tests" | tr -cd 'A-Za-z0-9_/,.' )
          uionly=$(printf '%s' "$uionly" | tr -cd 'A-Za-z0-9_/,.' )
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
          echo "studio=$studio" >> "$GITHUB_OUTPUT"
          echo "unit_tests=$tests" >> "$GITHUB_OUTPUT"
          echo "ui_only=$uionly" >> "$GITHUB_OUTPUT"
          echo "UI tests: $ui (${uionly:-all classes}) | studio renders: $studio | unit tests: ${tests:-all}"
      - name: Pinned garment head
        id: gpin
        run: echo "sha=$(python3 -c 'import json;print(json.load(open("scripts/garment/model.json"))["sha256"])')" >> "$GITHUB_OUTPUT"
      # Touch the cached garment head (~4 MB) on every run so it is never evicted: it is the only
      # copy once the training run's artifact expires.
      - name: Keep the garment head cached
        uses: actions/cache/restore@v4
        with:
          path: scripts/garment/.artifacts
          key: garment-head-${{ steps.gpin.outputs.sha }}
      - name: Are the model caches there?
        id: models
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          FACE_KEY: face-models-v2-${{ hashFiles('scripts/build_face_models.sh', 'scripts/convert_face_models.py') }}
          WARDROBE_KEY: wardrobe-models-v2-${{ hashFiles('scripts/build_wardrobe_models.sh', 'scripts/convert_wardrobe_models.py', 'scripts/fashion_vocabulary.json', 'scripts/garment/model.json', 'scripts/garment/export.py', 'scripts/garment/head.py', 'scripts/garment/backbone.py') }}
          STUDIO_KEY: studio-models-v1-${{ hashFiles('scripts/build_studio_models.sh', 'scripts/convert_studio_model.py') }}
        run: |
          # A run can restore its own branch's caches and main's. Any doubt (API error) means build.
          build=false
          for k in "$FACE_KEY" "$WARDROBE_KEY" "$STUDIO_KEY"; do
            n=$(gh api "repos/$REPO/actions/caches?key=$k&per_page=100" \
                  --jq "[.actions_caches[] | select(.key == \"$k\" and (.ref == \"refs/heads/main\" or .ref == \"$REF\"))] | length" 2>/dev/null || echo 0)
            echo "$k: $n"
            [ "${n:-0}" -gt 0 ] || build=true
          done
          echo "build=$build" >> "$GITHUB_OUTPUT"

  models:
    needs: plan
    if: needs.plan.outputs.build_models == 'true'
    runs-on: xcode-27
    timeout-minutes: 100
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore face models
        id: cache
        uses: actions/cache@v4
        with:
          path: StyleMate/FaceModels
          key: face-models-v2-${{ hashFiles('scripts/build_face_models.sh', 'scripts/convert_face_models.py') }}
      - name: Build face models
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build_face_models.sh
      - name: Restore wardrobe models
        id: wcache
        uses: actions/cache@v4
        with:
          path: StyleMate/ML
          key: wardrobe-models-v2-${{ hashFiles('scripts/build_wardrobe_models.sh', 'scripts/convert_wardrobe_models.py', 'scripts/fashion_vocabulary.json', 'scripts/garment/model.json', 'scripts/garment/export.py', 'scripts/garment/head.py', 'scripts/garment/backbone.py') }}
      # GarmentNet's trained head is StyleMate's own model (DINOv2 backbone + a head trained on
      # Fashionpedia/COCO by garment-model.yml). It lives only in that run's `garment-head` artifact;
      # scripts/garment/model.json pins the run and the file's sha256.
      - name: Pinned garment head
        id: gpin
        if: steps.wcache.outputs.cache-hit != 'true'
        run: |
          echo "run=$(python3 -c 'import json;print(json.load(open("scripts/garment/model.json"))["run_id"])')" >> "$GITHUB_OUTPUT"
          echo "artifact=$(python3 -c 'import json;print(json.load(open("scripts/garment/model.json")).get("artifact", "garment-head"))')" >> "$GITHUB_OUTPUT"
          echo "sha=$(python3 -c 'import json;print(json.load(open("scripts/garment/model.json"))["sha256"])')" >> "$GITHUB_OUTPUT"
      # The head is kept in the Actions cache by its sha256 (the plan job touches it on every run, so
      # it is never evicted); the training run's artifact (90 days) is only the first source.
      - name: Restore the garment head
        id: hcache
        if: steps.wcache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: scripts/garment/.artifacts
          key: garment-head-${{ steps.gpin.outputs.sha }}
      - name: Download the garment head
        if: steps.wcache.outputs.cache-hit != 'true' && steps.hcache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.gpin.outputs.artifact }}
          path: scripts/garment/.artifacts
          run-id: ${{ steps.gpin.outputs.run }}
          github-token: ${{ github.token }}
      - name: Build wardrobe models
        if: steps.wcache.outputs.cache-hit != 'true'
        run: bash scripts/build_wardrobe_models.sh
      - name: Check the models
        run: |
          du -sh StyleMate/FaceModels/* StyleMate/ML/*
          test -f StyleMate/FaceModels/FaceDetectYuNet.mlpackage/Manifest.json
          test -f StyleMate/FaceModels/FaceEmbedSFace.mlpackage/Manifest.json
          test -f StyleMate/ML/GarmentNet.mlpackage/Manifest.json
          test -f StyleMate/ML/FashionEncoder.mlpackage/Manifest.json
          test -f StyleMate/ML/FashionVocabulary.json
          # The non-commercial FASHN / Fashionpedia-SegFormer models must never be bundled again.
          for m in GarmentParser GarmentLabeler; do
            if [ -e "StyleMate/ML/$m.mlpackage" ]; then echo "::error::$m (non-commercial) is in StyleMate/ML"; exit 1; fi
          done
      # Studio-render diffusion model (SD 1.5-class img2img / text2img, ~1 GB). Cached at the repo root,
      # NOT under StyleMate/ML, so a wardrobe-cache miss can never sweep it into the wardrobe cache.
      - name: Restore studio models
        id: scache
        uses: actions/cache@v4
        with:
          path: StudioModels.bundle
          key: studio-models-v1-${{ hashFiles('scripts/build_studio_models.sh', 'scripts/convert_studio_model.py') }}
      - name: Build studio models
        if: steps.scache.outputs.cache-hit != 'true'
        run: bash scripts/build_studio_models.sh --out "$GITHUB_WORKSPACE/StudioModels.bundle"
      - name: Check the studio models
        run: |
          du -sh StudioModels.bundle StudioModels.bundle/*
          for m in TextEncoder Unet VAEEncoder VAEDecoder; do
            test -f "StudioModels.bundle/$m.mlmodelc/coremldata.bin"
          done
          test -s StudioModels.bundle/vocab.json
          test -s StudioModels.bundle/merges.txt
          cat StudioModels.bundle/studio_manifest.json

  test:
    needs: [plan, models]
    # Runs when the models job was skipped (caches already there), not only when it succeeded.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.models.result != 'failure' && github.event_name != 'schedule' }}
    runs-on: xcode-27
    # 75 -> 120: the studio-render test runs SD img2img on the simulator's CPU.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Restore face models
        uses: actions/cache/restore@v4
        with:
          path: StyleMate/FaceModels
          key: face-models-v2-${{ hashFiles('scripts/build_face_models.sh', 'scripts/convert_face_models.py') }}
          fail-on-cache-miss: true
      - name: Restore wardrobe models
        uses: actions/cache/restore@v4
        with:
          path: StyleMate/ML
          key: wardrobe-models-v2-${{ hashFiles('scripts/build_wardrobe_models.sh', 'scripts/convert_wardrobe_models.py', 'scripts/fashion_vocabulary.json', 'scripts/garment/model.json', 'scripts/garment/export.py', 'scripts/garment/head.py', 'scripts/garment/backbone.py') }}
          fail-on-cache-miss: true
      - name: Restore studio models
        uses: actions/cache/restore@v4
        with:
          path: StudioModels.bundle
          key: studio-models-v1-${{ hashFiles('scripts/build_studio_models.sh', 'scripts/convert_studio_model.py') }}
          fail-on-cache-miss: true
      - name: Place studio models
        # StyleMate/ML/Studio/StudioModels.bundle is inside the synchronized group, so Xcode copies the
        # .bundle (and the compiled .mlmodelc folders in it) into the app verbatim.
        run: mkdir -p StyleMate/ML/Studio && mv StudioModels.bundle StyleMate/ML/Studio/

      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Write Secrets.swift
        # The key is read at run time from the environment in DEBUG test runs, so the file only needs to
        # compile. It never holds the real key in CI.
        run: |
          cat > StyleMate/Secrets.swift <<'EOF'
          enum Secrets {
              static let geminiAPIKey = ""
          }
          EOF

      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(rt,x) for rt,xs in d.items() if "iOS" in rt for x in xs if x["name"].startswith("iPhone") and "Pro" in x["name"]]
          c.sort(key=lambda t:t[0])
          print(c[-1][1]["udid"])')
          echo "SIM=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID" || true

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project StyleMate.xcodeproj -scheme StyleMate \
            -destination "id=$SIM" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E "error:|warning: .*StyleMate/|\*\* TEST BUILD" || true
          grep -q "\*\* TEST BUILD SUCCEEDED \*\*" build.log

      - name: Check the studio models in the app
        # They ship inside StudioModels.bundle so Xcode copies the compiled .mlmodelc folders verbatim.
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name StyleMate.app -type d | head -1)
          ls -la "$APP/StudioModels.bundle"
          du -sh "$APP" "$APP/StudioModels.bundle"
          diff -rq StyleMate/ML/Studio/StudioModels.bundle "$APP/StudioModels.bundle"

      - name: Check the face models in the app (licence gate)
        # Only commercially usable face weights may ship (docs/MODEL-LICENSING.md): YuNet (MIT) + SFace
        # (Apache-2.0). The InsightFace / AdaFace models are non-commercial and must never be in the app.
        run: |
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name StyleMate.app -type d | head -1)
          bash scripts/check_face_models.sh "$APP"

      - name: Unit tests
        env:
          UNIT_TESTS: ${{ needs.plan.outputs.unit_tests }}
        run: |
          set -o pipefail
          # Pass the fixtures + report paths into the test process (xcodebuild strips the TEST_RUNNER_ prefix).
          export TEST_RUNNER_FIXTURES_DIR="$GITHUB_WORKSPACE/StyleMateTests/Fixtures"
          export TEST_RUNNER_REPORT_DIR="$RUNNER_TEMP/report"
          mkdir -p "$RUNNER_TEMP/report"
          # `plan` picks all unit tests, or only the ones a commit asked for ([tests: ...]).
          ONLY="-only-testing:StyleMateTests"
          if [ -n "$UNIT_TESTS" ]; then
            ONLY=""
            IFS=',' read -ra T <<< "$UNIT_TESTS"
            for t in "${T[@]}"; do [ -n "$t" ] && ONLY="$ONLY -only-testing:$t"; done
          fi
          echo "Testing: $ONLY"
          xcodebuild test-without-building \
            -project StyleMate.xcodeproj -scheme StyleMate \
            -destination "id=$SIM" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            $ONLY \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" \
            2>&1 | tee test.log | grep -E "✔|✘|Test .*(passed|failed)|error:|\[Report\]|\*\* TEST" || true
          grep -qE "\*\* TEST (EXECUTE )?SUCCEEDED \*\*" test.log

      - name: Test failure details
        # Swift Testing's issue messages live only in the result bundle; print them.
        if: always()
        run: |
          [ -d "$RUNNER_TEMP/tests.xcresult" ] || exit 0
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/tests.xcresult" > "$RUNNER_TEMP/report/test-results.json" 2>/dev/null || true
          python3 - "$RUNNER_TEMP/report/test-results.json" <<'PY' || true
          import json, sys
          def walk(n, path):
              name = n.get("name", "")
              if n.get("nodeType") == "Failure Message":
                  print(f"FAIL {' > '.join(path)}: {name}")
              for c in n.get("children", []) or []:
                  walk(c, path + [name] if n.get("nodeType") in ("Test Case", "Test Suite") else path)
          d = json.load(open(sys.argv[1]))
          for n in d.get("testNodes", []):
              walk(n, [])
          PY

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: |
            build.log
            test.log
            ${{ runner.temp }}/report
          if-no-files-found: ignore

  # Studio renders for every product family (StudioCoverageTests: shoes, hats, full-length
  # trousers, a light-grey coat) from the fixed cutouts in StyleMateTests/Fixtures/studio. The
  # simulator runs the diffusion UNet on its CPU (~2–4 min per candidate), so the manifest is split
  # over three runners; each uploads `studio-coverage-<shard>` (renders + coverage_shard<n>.json).
  studio:
    needs: [plan, models]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.models.result != 'failure' && github.event_name != 'schedule' && needs.plan.outputs.studio == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Restore face models
        uses: actions/cache/restore@v4
        with:
          path: StyleMate/FaceModels
          key: face-models-v2-${{ hashFiles('scripts/build_face_models.sh', 'scripts/convert_face_models.py') }}
          fail-on-cache-miss: true
      - name: Restore wardrobe models
        uses: actions/cache/restore@v4
        with:
          path: StyleMate/ML
          key: wardrobe-models-v2-${{ hashFiles('scripts/build_wardrobe_models.sh', 'scripts/convert_wardrobe_models.py', 'scripts/fashion_vocabulary.json', 'scripts/garment/model.json', 'scripts/garment/export.py', 'scripts/garment/head.py', 'scripts/garment/backbone.py') }}
          fail-on-cache-miss: true
      - name: Restore studio models
        uses: actions/cache/restore@v4
        with:
          path: StudioModels.bundle
          key: studio-models-v1-${{ hashFiles('scripts/build_studio_models.sh', 'scripts/convert_studio_model.py') }}
          fail-on-cache-miss: true
      - name: Place studio models
        run: mkdir -p StyleMate/ML/Studio && mv StudioModels.bundle StyleMate/ML/Studio/
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Write Secrets.swift
        run: |
          cat > StyleMate/Secrets.swift <<'EOF'
          enum Secrets {
              static let geminiAPIKey = ""
          }
          EOF
      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(rt,x) for rt,xs in d.items() if "iOS" in rt for x in xs if x["name"].startswith("iPhone") and "Pro" in x["name"]]
          c.sort(key=lambda t:t[0])
          print(c[-1][1]["udid"])')
          echo "SIM=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project StyleMate.xcodeproj -scheme StyleMate \
            -destination "id=$SIM" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E "error:|\*\* TEST BUILD" || true
          grep -q "\*\* TEST BUILD SUCCEEDED \*\*" build.log
      - name: Studio coverage renders
        run: |
          set -o pipefail
          export TEST_RUNNER_FIXTURES_DIR="$GITHUB_WORKSPACE/StyleMateTests/Fixtures"
          export TEST_RUNNER_REPORT_DIR="$RUNNER_TEMP/report"
          export TEST_RUNNER_STUDIO_SHARD="${{ matrix.shard }}"
          mkdir -p "$RUNNER_TEMP/report"
          xcodebuild test-without-building \
            -project StyleMate.xcodeproj -scheme StyleMate \
            -destination "id=$SIM" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -only-testing:StyleMateTests/StudioCoverageTests \
            -resultBundlePath "$RUNNER_TEMP/studio.xcresult" \
            2>&1 | tee studio.log | grep -E "✔|✘|Test .*(passed|failed)|error:|\[Report\]|\[Studio\]|\*\* TEST" || true
          grep -qE "\*\* TEST (EXECUTE )?SUCCEEDED \*\*" studio.log
      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-coverage-${{ matrix.shard }}
          path: |
            studio.log
            ${{ runner.temp }}/report
          if-no-files-found: ignore

  # End-to-end UI tests (StyleMateUITests): drive the real app in the simulator with the DEBUG
  # launch hooks (demo user, skipped onboarding, seeded wardrobe) and export every step's
  # screenshot from the .xcresult into the `e2e-screens` artifact. Independent of `test`.
  ui-tests:
    needs: [plan, models]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.models.result != 'failure' && github.event_name != 'schedule' && needs.plan.outputs.ui == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Restore face models
        uses: actions/cache/restore@v4
        with:
          path: StyleMate/FaceModels
          key: face-models-v2-${{ hashFiles('scripts/build_face_models.sh', 'scripts/convert_face_models.py') }}
          fail-on-cache-miss: true
      - name: Restore wardrobe models
        uses: actions/cache/restore@v4
        with:
          path: StyleMate/ML
          key: wardrobe-models-v2-${{ hashFiles('scripts/build_wardrobe_models.sh', 'scripts/convert_wardrobe_models.py', 'scripts/fashion_vocabulary.json', 'scripts/garment/model.json', 'scripts/garment/export.py', 'scripts/garment/head.py', 'scripts/garment/backbone.py') }}
          fail-on-cache-miss: true

      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Write Secrets.swift
        run: |
          cat > StyleMate/Secrets.swift <<'SWIFT'
          enum Secrets {
              static let geminiAPIKey = ""
          }
          SWIFT

      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(rt,x) for rt,xs in d.items() if "iOS" in rt for x in xs if x["name"].startswith("iPhone") and "Pro" in x["name"]]
          c.sort(key=lambda t:t[0])
          print(c[-1][1]["udid"])')
          echo "SIM=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID" || true

      - name: Build for testing
        # Unlike the unit-test job, the app must actually run here, so it is ad-hoc signed
        # ("Sign to Run Locally", no team or profile needed for the simulator). That embeds the
        # simulated entitlements; without them CKContainer.default() throws at launch.
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project StyleMate.xcodeproj -scheme StyleMate \
            -destination "id=$SIM" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee ui-build.log | grep -E "error:|warning: .*StyleMateUITests/|warning: .*StyleMate/Debug/|\*\* TEST BUILD" || true
          grep -q "\*\* TEST BUILD SUCCEEDED \*\*" ui-build.log

      - name: Prepare the simulator (app, permissions, location, photo library)
        run: |
          xcrun simctl bootstatus "$SIM" -b
          APP=$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Debug-iphonesimulator/StyleMate.app)
          xcrun simctl install "$SIM" "$APP"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          echo "Bundle id: $BUNDLE"
          codesign -d --entitlements - "$APP" 2>&1 | head -20 || true
          xcrun simctl privacy "$SIM" grant location "$BUNDLE" || true
          xcrun simctl privacy "$SIM" grant photos "$BUNDLE" || true
          xcrun simctl location "$SIM" set 51.5072,-0.1276 || true
          xcrun simctl addmedia "$SIM" StyleMateUITests/Fixtures/street_coat_boots.jpg

      - name: UI tests
        env:
          UI_ONLY: ${{ needs.plan.outputs.ui_only }}
        run: |
          set -o pipefail
          # A branch commit's `[ui-only: ClassA, ClassB]` runs only those classes (the real first run has its own step).
          ONLY="-only-testing:StyleMateUITests"
          if [ -n "$UI_ONLY" ]; then
            ONLY=""
            IFS=',' read -ra T <<< "$UI_ONLY"
            for t in "${T[@]}"; do
              case "$t" in ""|*RealFirstRunE2ETests*) ;; *) ONLY="$ONLY -only-testing:StyleMateUITests/${t#StyleMateUITests/}";; esac
            done
            [ -n "$ONLY" ] || { echo "[ui-only: $UI_ONLY]: no other UI tests this run"; exit 0; }
          fi
          echo "UI tests: $ONLY"
          xcodebuild test-without-building \
            -project StyleMate.xcodeproj -scheme StyleMate \
            -destination "id=$SIM" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            $ONLY \
            -skip-testing:StyleMateUITests/RealFirstRunE2ETests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" \
            2>&1 | tee ui-test.log | grep -E "✔|✘|Test .*(passed|failed|skipped)|error:|\[UITest\]|\*\* TEST" || true
          grep -qE "\*\* TEST (EXECUTE )?SUCCEEDED \*\*" ui-test.log

      # The first run as a new user lives it (RealFirstRunE2ETests): nothing pre-granted (the test answers the
      # real photo / location prompts), the selfie from a fixture face (-uiTestSelfieFixture), and a ~260-photo
      # library to scan: 8 photos of that person, the other fixtures as strangers, filler with nobody in it, a
      # few of them stuck like iCloud downloads (-uiTestStallSomePhotos). Last, so the other tests keep their
      # one-photo library and pre-granted permissions. Runs even when the step above failed.
      - name: Real first run (fresh permissions, selfie, library scan)
        if: ${{ !cancelled() }}
        env:
          UI_ONLY: ${{ needs.plan.outputs.ui_only }}
        run: |
          set -o pipefail
          if [ -n "$UI_ONLY" ] && ! printf '%s' "$UI_ONLY" | grep -q RealFirstRunE2ETests; then
            echo "[ui-only: $UI_ONLY]: not this run"; exit 0
          fi
          APP=$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Debug-iphonesimulator/StyleMate.app)
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          LIB="$RUNNER_TEMP/ui-library"
          xcrun swiftc -swift-version 5 -O -o "$RUNNER_TEMP/make-ui-library" scripts/ui_test_library.swift
          "$RUNNER_TEMP/make-ui-library" StyleMateTests/Fixtures/photos "$LIB" 240
          cp "$LIB/MANIFEST.txt" ui-library-manifest.txt
          xcrun simctl addmedia "$SIM" "$LIB"/*.jpg
          xcrun simctl privacy "$SIM" reset all "$BUNDLE" || true
          # How Photos imported them: the dates drive the scan's grouping, the original names the stall hook.
          DB="$HOME/Library/Developer/CoreSimulator/Devices/$SIM/data/Media/PhotoData/Photos.sqlite"
          sqlite3 "$DB" "SELECT datetime(a.ZDATECREATED + 978307200, 'unixepoch'), b.ZORIGINALFILENAME FROM ZASSET a JOIN ZADDITIONALASSETATTRIBUTES b ON b.ZASSET = a.Z_PK ORDER BY a.ZDATECREATED DESC LIMIT 12;" || true
          sqlite3 "$DB" "SELECT COUNT(*) FROM ZASSET;" || true
          # Let Photos finish the import before the app looks (open it, wait until every asset is complete), and
          # log the assets' kind / visibility / completeness. Note: Photos never makes the small previews for
          # these imports (thumbnail requests answer PHPhotosError 3303), which the scan handles by decoding.
          STATE="SELECT ZKINDSUBTYPE, ZVISIBILITYSTATE, ZTRASHEDSTATE, ZCOMPLETE, ZHIDDEN, COUNT(*) FROM ZASSET GROUP BY 1,2,3,4,5;"
          sqlite3 "$DB" "$STATE" || true
          xcrun simctl launch "$SIM" com.apple.mobileslideshow || true
          for i in $(seq 1 36); do
            n=$(sqlite3 "$DB" "SELECT COUNT(*) FROM ZASSET WHERE ZCOMPLETE = 1 AND ZTRASHEDSTATE = 0;" 2>/dev/null || echo x)
            echo "complete: $n"
            { [ "$n" = "x" ] || [ "$n" -ge 261 ]; } && break
            sleep 5
          done
          sleep 15
          xcrun simctl terminate "$SIM" com.apple.mobileslideshow || true
          sqlite3 "$DB" "$STATE" || true
          xcodebuild test-without-building \
            -project StyleMate.xcodeproj -scheme StyleMate \
            -destination "id=$SIM" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -only-testing:StyleMateUITests/RealFirstRunE2ETests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/ui-real.xcresult" \
            2>&1 | tee ui-real-test.log | grep -E "✔|✘|Test .*(passed|failed|skipped)|error:|\[UITest\]|\*\* TEST" || true
          # The app's own console (-uiTestLogToFile): what the scan, Find yourself and the selfie check logged.
          DATA=$(xcrun simctl get_app_container "$SIM" "$BUNDLE" data 2>/dev/null) && cp "$DATA/Library/Caches/uitest-console.log" ui-real-app-console.log || true
          grep -E "\[FindYou\]|\[Identity\]|Auto-scan|\[UITest\]" ui-real-app-console.log | head -80 || true
          sqlite3 "$DB" "$STATE" || true
          grep -qE "\*\* TEST (EXECUTE )?SUCCEEDED \*\*" ui-real-test.log

      - name: Export screenshots
        if: always()
        run: |
          OUT="$RUNNER_TEMP/e2e-screens"
          mkdir -p "$OUT"
          RAWS=""
          for B in ui ui-real; do
            [ -d "$RUNNER_TEMP/$B.xcresult" ] || { echo "No $B result bundle"; continue; }
            RAW="$RUNNER_TEMP/attachments-raw-$B"
            mkdir -p "$RAW"
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/$B.xcresult" --output-path "$RAW" || true
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/$B.xcresult" > "$OUT/$B-test-summary.json" || true
            xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/$B.xcresult" > "$OUT/$B-test-results.json" || true
            RAWS="$RAWS $RAW"
          done
          [ -n "$RAWS" ] || exit 0
          # Name files after the attachment names the tests give them ("test02_...-03-option-1-of-5").
          python3 - "$OUT" $RAWS <<'PY'
          import json, os, re, shutil, sys
          out, raws = sys.argv[1], sys.argv[2:]
          seen = 0
          for raw in raws:
              manifest = os.path.join(raw, "manifest.json")
              entries = json.load(open(manifest)) if os.path.exists(manifest) else []
              for test in entries:
                  for a in test.get("attachments", []):
                      src = os.path.join(raw, a.get("exportedFileName", ""))
                      if not os.path.isfile(src):
                          continue
                      name = a.get("suggestedHumanReadableName") or a["exportedFileName"]
                      if name.startswith("Debug description"):                      # XCTest query-debug noise
                          continue
                      stem, ext = os.path.splitext(name)
                      stem = re.sub(r"_\d+_[0-9A-Fa-f-]{36}$", "", stem)        # drop xcresult's _0_<UUID>
                      stem = re.sub(r"[^A-Za-z0-9._-]+", "-", stem).strip("-")
                      dst = os.path.join(out, stem + (ext or os.path.splitext(src)[1]))
                      if os.path.exists(dst):
                          dst = os.path.join(out, f"{stem}-{seen}{ext}")
                      shutil.copy(src, dst)
                      seen += 1
              if not entries:                                                       # unknown layout: copy as-is
                  for f in os.listdir(raw):
                      shutil.copy(os.path.join(raw, f), out)
          print(f"Exported {seen} attachments")
          PY
          cp ui-build.log ui-test.log ui-real-test.log ui-real-app-console.log ui-library-manifest.txt "$OUT"/ 2>/dev/null || true
          ls -la "$OUT"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screens
          path: ${{ runner.temp }}/e2e-screens
          if-no-files-found: ignore

  # The configuration that ships: compile Release for a real device (optimizer on, no DEBUG
  # code, no simulator) so a Release-only compile error can't first show up in the TestFlight
  # workflow. Compile only — no signing, no tests — in parallel with the test jobs.
  release-build:
    needs: [plan, models]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.models.result != 'failure' && github.event_name != 'schedule' }}
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore face models
        uses: actions/cache/restore@v4
        with:
          path: StyleMate/FaceModels
          key: face-models-v2-${{ hashFiles('scripts/build_face_models.sh', 'scripts/convert_face_models.py') }}
          fail-on-cache-miss: true
      - name: Restore wardrobe models
        uses: actions/cache/restore@v4
        with:
          path: StyleMate/ML
          key: wardrobe-models-v2-${{ hashFiles('scripts/build_wardrobe_models.sh', 'scripts/convert_wardrobe_models.py', 'scripts/fashion_vocabulary.json', 'scripts/garment/model.json', 'scripts/garment/export.py', 'scripts/garment/head.py', 'scripts/garment/backbone.py') }}
          fail-on-cache-miss: true
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Write Secrets.swift
        run: |
          cat > StyleMate/Secrets.swift <<'SWIFT'
          enum Secrets {
              static let geminiAPIKey = ""
          }
          SWIFT
      - name: Build Release (generic iOS device)
        run: |
          set -o pipefail
          xcodebuild build \
            -project StyleMate.xcodeproj -scheme StyleMate \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-release" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee release-build.log | grep -E "error:|warning: .*StyleMate/|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" release-build.log
      - name: Check the face models in the Release app (licence gate)
        run: |
          APP=$(find "$RUNNER_TEMP/dd-release/Build/Products" -maxdepth 2 -name StyleMate.app -type d | head -1)
          bash scripts/check_face_models.sh "$APP"
      - name: No test hooks in the Release binary
        # The DEBUG UI-test hooks (seeded wardrobe, the fake Sign in with Apple account) must not ship.
        run: |
          BIN=$(find "$RUNNER_TEMP/dd-release/Build/Products" -path "*Release-iphoneos/StyleMate.app/StyleMate" -type f | head -1)
          [ -n "$BIN" ] || { echo "::error::Release binary not found"; exit 1; }
          if strings "$BIN" | grep -E "uiTestSeedWardrobe|uiTestFakeAppleSignIn|uiTestDemoUser|uiTestSelfieFixture|uiTestStallSomePhotos|uiTestLogToFile|Continue as test user"; then
            echo "::error::DEBUG UI-test hooks found in the Release binary"; exit 1
          fi
          echo "No test hooks in $BIN"
      - name: Only commercially licensed garment models in the app
        run: |
          APP=$(find "$RUNNER_TEMP/dd-release/Build/Products" -maxdepth 2 -name StyleMate.app -type d | head -1)
          ls "$APP" | grep -E "mlmodelc|Vocabulary" || true
          test -d "$APP/GarmentNet.mlmodelc" || { echo "::error::GarmentNet missing from the Release app"; exit 1; }
          for m in GarmentParser GarmentLabeler; do
            if [ -e "$APP/$m.mlmodelc" ]; then echo "::error::$m (non-commercial) is in the Release app"; exit 1; fi
          done
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: release-build.log
          if-no-files-found: ignore

  # Concurrency audit (heavy, so weekly on main or on demand — not on every push):
  #   1. a build with SWIFT_STRICT_CONCURRENCY=complete; the warning list is the report;
  #   2. the face-identity + reliability unit tests under Thread Sanitizer (they hammer the
  #      shared face service from several threads).
  # On demand: Run workflow with `audit` ticked.
  concurrency-audit:
    needs: [plan, models]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.models.result != 'failure' && (github.event_name == 'schedule' || inputs.audit) }}
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Restore face models
        uses: actions/cache/restore@v4
        with:
          path: StyleMate/FaceModels
          key: face-models-v2-${{ hashFiles('scripts/build_face_models.sh', 'scripts/convert_face_models.py') }}
          fail-on-cache-miss: true
      - name: Restore wardrobe models
        uses: actions/cache/restore@v4
        with:
          path: StyleMate/ML
          key: wardrobe-models-v2-${{ hashFiles('scripts/build_wardrobe_models.sh', 'scripts/convert_wardrobe_models.py', 'scripts/fashion_vocabulary.json', 'scripts/garment/model.json', 'scripts/garment/export.py', 'scripts/garment/head.py', 'scripts/garment/backbone.py') }}
          fail-on-cache-miss: true
      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Write Secrets.swift
        run: |
          cat > StyleMate/Secrets.swift <<'SWIFT'
          enum Secrets {
              static let geminiAPIKey = ""
          }
          SWIFT
      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(rt,x) for rt,xs in d.items() if "iOS" in rt for x in xs if x["name"].startswith("iPhone") and "Pro" in x["name"]]
          c.sort(key=lambda t:t[0])
          print(c[-1][1]["udid"])')
          echo "SIM=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
      - name: Strict-concurrency build (report only)
        run: |
          xcodebuild build \
            -project StyleMate.xcodeproj -scheme StyleMate \
            -destination "id=$SIM" \
            -derivedDataPath "$RUNNER_TEMP/dd-strict" \
            CODE_SIGNING_ALLOWED=NO SWIFT_STRICT_CONCURRENCY=complete \
            > strict-build.log 2>&1 || true
          grep -E "warning: .*StyleMate/.*(Sendable|actor|isolat|concurren|data race)" strict-build.log | sort -u > strict-concurrency-warnings.txt || true
          echo "Strict-concurrency warnings: $(wc -l < strict-concurrency-warnings.txt)"
          cut -d: -f1 strict-concurrency-warnings.txt | sed 's#.*/StyleMate/##' | sort | uniq -c | sort -rn | head -40
          grep -q "\*\* BUILD SUCCEEDED \*\*" strict-build.log
      - name: Thread Sanitizer (face identity + reliability tests)
        run: |
          set -o pipefail
          export TEST_RUNNER_FIXTURES_DIR="$GITHUB_WORKSPACE/StyleMateTests/Fixtures"
          export TEST_RUNNER_REPORT_DIR="$RUNNER_TEMP/report"
          mkdir -p "$RUNNER_TEMP/report"
          xcodebuild test \
            -project StyleMate.xcodeproj -scheme StyleMate \
            -destination "id=$SIM" \
            -derivedDataPath "$RUNNER_TEMP/dd-tsan" \
            -enableThreadSanitizer YES \
            -only-testing:StyleMateTests/FaceMatchingTests \
            -only-testing:StyleMateTests/ReliabilityTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee tsan.log | grep -E "✔|✘|ThreadSanitizer|SUMMARY|Test .*(passed|failed)|error:|\*\* TEST" || true
          if grep -q "WARNING: ThreadSanitizer" tsan.log; then
            echo "::error::Thread Sanitizer reported data races (see tsan.log)"
            exit 1
          fi
          grep -qE "\*\* TEST (EXECUTE )?SUCCEEDED \*\*" tsan.log
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concurrency-audit
          path: |
            strict-build.log
            strict-concurrency-warnings.txt
            tsan.log
          if-no-files-found: ignore
