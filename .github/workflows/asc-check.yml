name: App Store Connect check

# Read-only: lists the StyleMate App ID (and its capabilities), the app record, versions, recent
# builds, TestFlight groups and subscriptions already in App Store Connect, so the repo can be matched
# to what exists. Uses the same repository secrets as testflight.yml. Only GET requests are sent.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check the secrets
        run: |
          missing=""
          for s in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See docs/TESTFLIGHT.md step 3."
            exit 1
          fi
      - uses: actions/checkout@v4
      - run: pip install --quiet "pyjwt[crypto]==2.9.0"
      - run: python3 scripts/asc_check.py
